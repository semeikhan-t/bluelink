<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">BlueLink social preview</title>
  <desc id="desc">BlueLink logo, local-first Markdown editor tagline, and a Linux application preview.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914" />
      <stop offset="0.55" stop-color="#0b1324" />
      <stop offset="1" stop-color="#101b31" />
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.18" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#0b63f6" stop-opacity="0.08" />
      <stop offset="1" stop-color="#0b63f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.95" cy="0.85" r="0.65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8da2c0" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000711" flood-opacity="0.7" />
    </filter>
    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#1683ff" flood-opacity="0.35" />
    </filter>
    <clipPath id="appClip">
      <rect x="660" y="160" width="560" height="315" rx="22" />
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)" />
  <rect width="1280" height="640" fill="url(#blueGlow)" />
  <rect width="1280" height="640" fill="url(#cyanGlow)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <path d="M0 0H520L0 520Z" fill="#1677ff" opacity="0.035" />
  <path d="M1280 640H760L1280 120Z" fill="#22d3ee" opacity="0.03" />

  <g filter="url(#logoGlow)">
    <image x="72" y="70" width="118" height="118" xlink:href="logo.png" href="logo.png" />
  </g>

  <text x="72" y="262" fill="#f8fbff" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">BlueLink</text>
  <rect x="72" y="286" width="126" height="5" rx="2.5" fill="url(#edge)" />

  <text x="72" y="342" fill="#dce7f7" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="500">Your Markdown. Your devices.</text>
  <text x="72" y="382" fill="#93a8c4" font-family="DejaVu Sans, sans-serif" font-size="29">No cloud in the middle.</text>

  <g font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" letter-spacing="1">
    <rect x="72" y="430" width="138" height="38" rx="19" fill="#142849" stroke="#2b67b9" stroke-width="1" />
    <text x="94" y="455" fill="#92c5ff">LOCAL-FIRST</text>
    <rect x="224" y="430" width="84" height="38" rx="19" fill="#142849" stroke="#2b67b9" stroke-width="1" />
    <text x="249" y="455" fill="#92c5ff">RUST</text>
    <rect x="322" y="430" width="92" height="38" rx="19" fill="#142849" stroke="#2b67b9" stroke-width="1" />
    <text x="344" y="455" fill="#92c5ff">LINUX</text>
  </g>

  <g font-family="DejaVu Sans, sans-serif">
    <circle cx="82" cy="526" r="5" fill="#22d3ee" />
    <text x="98" y="532" fill="#7189aa" font-size="17" font-weight="600" letter-spacing="1.2">PLAIN FILES · WIKILINKS · PRIVATE SYNC ENGINE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="646" y="146" width="588" height="343" rx="30" fill="#07101f" stroke="#284364" stroke-width="2" />
    <image x="660" y="160" width="560" height="315" preserveAspectRatio="xMidYMid slice" clip-path="url(#appClip)" xlink:href="bluelink_after.png" href="bluelink_after.png" />
    <rect x="660" y="160" width="560" height="315" rx="22" fill="none" stroke="#4c6d96" stroke-opacity="0.6" stroke-width="1.5" />
  </g>

  <rect x="656" y="118" width="132" height="34" rx="17" fill="#071a32" stroke="#1e5f9f" stroke-width="1" />
  <circle cx="676" cy="135" r="5" fill="#22d3ee" />
  <text x="691" y="141" fill="#b9d8f8" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PRE-ALPHA</text>

  <rect x="0" y="636" width="1280" height="4" fill="url(#edge)" />
</svg>
